<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akıllı Fabrika</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#132944;font:14px 'Segoe UI',sans-serif}aside{position:fixed;width:235px;height:100vh;background:#102c49;color:white;padding:32px 18px}h2{font-size:21px}small,.muted{color:#78899b}aside small{color:#88b9c9}nav{margin-top:48px}button,select,input{font:inherit;border:1px solid #dae3eb;border-radius:7px;padding:11px 16px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}nav button{width:100%;text-align:left;background:transparent;color:#cedce9;border:0;margin:5px 0;padding:15px}nav button.on,.primary{background:#009c9a;color:white;border:0}main{margin-left:235px;padding:30px 36px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{margin:0;font-size:32px;letter-spacing:-1px}p{line-height:1.6}.panel,.metric,.machine{background:white;border:1px solid #e2e9f0;border-radius:11px;padding:22px;margin-bottom:18px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:18px}.four{grid-template-columns:repeat(4,1fr)}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr}.metric label{display:block;color:#78899b;margin-bottom:12px}.metric strong{font-size:27px}.badge{display:inline-block;background:#e8f8f2;color:#178060;padding:6px 10px;border-radius:20px;font-size:12px}.warn{background:#fff0ec;color:#ca5942}h3{margin:0 0 20px;font-size:17px}.machine{border-top:3px solid var(--c)}.machine h3{color:var(--c)}.values{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:25px 0}.values small{display:block;margin-bottom:7px}.values b{font-size:18px}.machine button{width:100%;background:#f0f6fb;border:0}.chart{width:100%;height:205px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:16px;border-bottom:1px solid const pages=['Genel Bakış','Makine Detayı','Karşılaştırma','Uyarı Merkezi','Geçmiş Çalışmalar'],colors=['#2388ee','#0aa9a2','#9159df'];let page=0,machine=0,history=null,tab=0,range=1,selected=-1;let state;try{state=JSON.parse(localStorage.getItem('factory-demo')||'null')}catch{}if(!state||!Array.isArray(state.runs))state={running:false,start:0,elapsed:0,runs:[]};const app=document.querySelector('#app');const fmt=(n,d=2)=>n.toLocaleString('tr-TR',{maximumFractionDigits:d,minimumFractionDigits:d});const time=s=>new Date(s*1000).toISOString().slice(11,19);const elapsed=()=>state.running?Math.min(1800,Math.floor((Date.now()-state.start)/1000)):state.elapsed;const save=()=>{try{localStorage.setItem('factory-demo',JSON.stringify(state))}catch{showError('Çalışma bu tarayıcıya kaydedilemedi. Depolama iznini kontrol edin.')}};const active=()=>history||{elapsed:demoConnected?elapsed():frozenElapsed,scenario:state.scenario};const data=i=>{let t=active().elapsed||0;return {p:t?([8,6,4][i]+Math.sin(t/9+i)*.5):0,e:t*[8,6,4][i]/3600,n:Math.floor(t/[20,24,28][i]),t}};function go(p){page=p;selected=-1;render()}function metric(label,value){return `<div class="metric"><label>${label}</label><strong>${value}</strong></div>`}function select(options,action){return `<select onchange="${action}">${options.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select>`}function oldChart(indices=[0,1,2],kind='power'){if(!active().elapsed)return '<div class="empty">Simülasyon başlatılmadı</div>';let lines=indices.map(i=>{let pts=Array.from({length:91},(_,j)=>{let y=kind==='energy'?160-j*1.5*(1-i*.15):kind==='production'?160-Math.floor(j/7)*10:85-i*25+Math.sin(j*.7+i)*9+Math.sin(j*.17)*12;return kind==='production'&&j?`H${45+j*8}V${y}`:`${j?'L':'M'}${45+j*8},${y}`}).join(' ');return `<path d="${pts}" fill="none" stroke="${colors[i]}" stroke-width="2.5"/>`}).join('');return `<svg class="chart" viewBox="0 0 800 205" preserveAspectRatio="none">${[30,70,110,150].map(y=>`<path d="M45 ${y}H780" aşlat</button><button ${!state.running?'disabled':''} onclick="stop()">■ Durdur</button><span class="badge">${state.running?'Çalışıyor':t?'Durduruldu':'Simülasyon başlatılmadı'}</span><span>Simülasyon süresi <b>${time(t)}</b></span><small>Son veri: ${t?new Date(history?.end||Date.now()).toLocaleTimeString('tr-TR'):'—'}</small></div>`:'')+metrics+`<div class="grid three">${ds.map((d,i)=>`<div class="machine" style="--c:${colors[i]}"><h3>▥ &nbsp; Makine ${i+1}</h3><span class="badge">${t?'Çalışıyor':'Durmuş'}</span> <span class="badge">${t>60?'Normal':'Veri birikiyor'}</span><div class="values"><div><small>Anlık güç</small><b>${t?fmt(d.p)+' kW':'—'}</b></div><div><small>Enerji</small><b>${t?fmt(d.e)+' kWh':'—'}</b></div><div><small>Üretim</small><b>${t?d.n+' adet':'—'}</b></div><div><small>Parça başına enerji</small><b>${d.n?fmt(d.e/d.n,4):'Üretim yok'}</b></div></div><button onclick="machine=${i};go(1)">Detayları Gör →</button></div>`).join('')}</div>`+panel('Anlık güç değişimi',`<div class="legend">${colors.map((c,i)=>`<span style="--c:${c}"><i class="dot"></i>Makine ${i+1}</span>`).join('')}</div>`+chart())+panel('Son aktif uyarılar',t>120?'<button onclick="go(3)">Makine 3 · Yapay zekâ anomalisi →</button>':'Aktif uyarı bulunmuyor.')}if(page===1){let d=ds[machine];app.innerHTML=`<div class="panel row">${select(['Makine 1','Makine 2','Makine 3'],'machine=+this.value;render()')}<span class="badge">${t?'Çalışıyor · İşleme':'Durmuş'}</span><small>Çalışma aşaması: ${t?'Parça işleme':'—'}</small></div><div class="grid four">${metric('Anlık güç',t?fmt(d.p)+' kW':'—')}${metric('Enerji',t?fmt(d.e)+' kWh':'—')}${metric('Üretim',t?d.n+' adet':'—')}${metric('Parça başına enerji',d.n?fmt(d.e/d.n,4)+' kWh/parça':'Üretim yok')}</div>`+panel('Güç–zaman',chart([machine])+'<div id="anomaly" hidden class="banner">Yapay zekâ anomalisi · Örnek analiz noktası<br>Anomali skoru: 0,72 · Kaynak: Yapay zekâ<br>Güç davranışı normal profilden sapıyor.</div>')+`<div class="grid two">${panel('Bi üm makineler','Makine 1','Makine 2','Makine 3'],'document.querySelector("#alerts").hidden=this.value!=0&&this.value!=3')}${select(['Tüm uyarı türleri','Beklenmeyen duruş','Veri gelmemesi','Uzun boşta bekleme','Güç sınırı','Parça başına enerji sınırı','Yapay zekâ anomalisi'],'document.querySelector("#alerts").hidden=this.value!=0&&this.value!=6')}<input type="date" aria-label="Uyarı tarihi"></div><div id="alerts">${!tab&&t>120?panel('Aktif uyarılar','<button onclick="selected=0;render()">Makine 3 · Yapay zekâ anomalisi · Yapay zekâ · Aktif →</button>'):'<div class="panel empty">Bu filtrelerde uyarı bulunmuyor.</div>'}</div>${selected===0?panel('Uyarı ayrıntısı','<p>Makine 3 · Olağandışı enerji–üretim davranışı</p><p>Kaynak: Yapay zekâ<br>Başlangıç: '+new Date().toLocaleString('tr-TR')+'<br>Kapanış: —<br>Durum: Aktif</p><button onclick="machine=2;go(1)">Makine Detayına Git →</button>'):''}`;if(page===4)app.innerHTML=`<div class="panel row"><input type="date" aria-label="Başlangıç tarihi">${select(['Tüm senaryolar','Normal çalışma','Uzun boşta bekleme','Yüksek güç tüketimi'],'filterRuns(this.options[this.selectedIndex].text)')}${select(['Tüm durumlar','Tamamlandı','Kullanıcı durdurdu','Hata'],'filterRuns(this.options[this.selectedIndex].text)')}</div>`+panel('Önceki simülasyonlar',state.runs.length?`<table><thead><tr><th>Çalışma / Senaryo</th><th>Başlangıç / Bitiş</th><th>Süre</th><th>Durum</th><th>Enerji / Üretim</th><th>Uyarı</th><th></th></tr></thead><tbody>${state.runs.map((r,i)=>`<tr data-filter="${r.scenario} Kullanıcı durdurdu"><td>#${r.id}<br>${r.scenario}</td><td>${new Date(r.start).toLocaleString('tr-TR')}<br>${new Date(r.end).toLocaleString('tr-TR')}</td><td>${time(r.elapsed)}</td><td><span class="badge warn">Kullanıcı durdurdu</span></td><td>${fmt(r.elapsed*18/3600)} kWh<br>${[20,24,28].reduce((s,x)=>s+Math.floor(r.elapsed/x),0)} adet</td><td>${r.elapsed>120?1:0}</td><td><button class="primary" onclick="history=state.runs[${i}];go(0)">Sonuçları Gör →</butto function alertsFor(r){if(!r||r.elapsed<120||r.scenario==='Normal çalışma')return [];let kind=r.scenario==='Yüksek güç tüketimi'?3:2;return [kind,5].map((k,i)=>({id:r.id+'-'+k,run:r.id,machine:2,type:types[k],source:k===5?'Yapay zekâ':'Kural',start:r.start+(120+i*15)*1000,end:r.end||null,description:k===5?'Enerji–üretim davranışı beklenen profilden sapıyor.':'Makine için tanımlanan izleme eşiği aşıldı.'})).filter(a=>a.start<=r.start+r.elapsed*1000)}

if(page===2)renderComparison();if(page===3)renderAlerts();if(page===4)renderHistory();}
function intervalData(r,i){let end=r?.elapsed||0,start=0;if(windowMode==='first')end/=2;if(windowMode==='last')start=end/2;let energy=(end-start)*[8,6,4][i]/3600,production=Math.floor(end/[20,24,28][i])-Math.floor(start/[20,24,28][i]);return {energy,production,ratio:production?energy/production:null,work:(end-start)/60,idle:0,down:0}}
function renderComparison(){let runs=history?[history]:runList();let r=runs.find(x=>String(x.id)===comparisonRun)||runs[0];let ds=[0,1,2].map(i=>intervalData(r,i));app.innerHTML=`<div class="panel row">${opt(runs.map(r=>[r.id,'Çalışma #'+r.id+' · '+r.scenario]),r?.id,"comparisonRun=this.value;render()",'Çalışma')}${opt([['all','Tüm çalışma'],['first','İlk yarı'],['last','Son yarı']],windowMode,"windowMode=this.value;render()",'Zaman aralığı')}</div>`;if(!r){app.innerHTML+=panel('Karşılaştırma','<div class="empty">Simülasyon başlatılmadı</div>');return}let charts=['Enerji tüketimi · kWh','Üretim · adet','Parça başına enerji · kWh/parça'].map((title,k)=>{let values=ds.map(d=>[d.energy,d.production,d.ratio][k]),max=Math.max(...values.map(x=>x||0),.001);return panel(title,`<svg class="chart" viewBox="0 0 440 205" role="img" aria-label="${title}"><path d="M35 170H430" stroke="#ccd7e2"/>${values.map((v,i)=>`<rect x="${65+i*125}" y="${170-(v||0)/max*125}" width="65" height="${(v||0)/max*125}" rx="4" fill="${colors[i]}"/><text text-anchor="middle" x="${97+i*125}" y="${158-(v||0)/max*125}" font-size="13" fill="#132944">${v===null?'Üretim yok':fmt(v,k===1?0:k===2?4:3)}</text><text x="${97+i*125}" text-anchor="middle" y="195" font-size="12" fill="#6d8094">Makine ${i+1}</text>`).join('')}</svg>`)});charts.push(panel('Çalışma / boşta bekleme / duruş · dakika',ds.map((d,i)=>`<p>Makine ${i+1}</p><div style="display:flex;height:28px;background:#f0f4f8"><div style="background:#44ad80;color:white;width:${d.work?100:0}%;text-align:center">${fmt(d.work)} dk</div></div>`).join('')+'<p class="muted">● Çalışma &nbsp; ◯ Boşta bekleme: 0 dk &nbsp; ◯ Duruş: 0 dk</p>'));app.innerHTML+=`<div class="grid two">${charts.join('')}</div>`+panel('Aynı zaman aralığındaki değerler',`<div style="overflow:auto"><table><tr><th>Makine</th><th>Enerji (kWh)</th><th>Üretim (adet)</th><th>kWh/parça</th><th>Çalışma (dk)</th><th>Boşta (dk)</th><th>Duruş (dk)</th></tr>${ds.map((d,i)=>`<tr><td style="color:${colors[i]}">Makine ${i+1}</td><td>${fmt(d.energy,3)}</td><td>${d.production}</td><td>${d.ratio===null?'Üretim yok':fmt(d.ratio,4)}</td><td>${fmt(d.work)}</td><td>0</td><td>0</td></tr>`).join('')}</table></div>`)}
function renderAlerts(){let rows=filteredAlerts(),all=(history?[history]:runList().filter(r=>r.id!=='live'||state.running)).flatMap(alertsFor);app.innerHTML=`<div class="row"><button class="${!tab?'primary':''}" onclick="tab=0;alertId=null;render()">Aktif (${all.filter(a=>!a.end).length})</button><button class="${tab?'primary':''}" onclick="tab=1;alertId=null;render()">Kapanmış (${all.filter(a=>a.end).length})</button></div><br><div class="panel row">${opt([['','Tüm makineler'],[0,'Makine 1'],[1,'Makine 2'],[2,'Makine 3']],af.machine,"af.machine=this.value;render()",'Makine')}${opt([['','Tüm türler'],...types.map(t=>[t,t])],af.type,"af.type=this.value;render()",'Uyarı türü')}${opt([['','Tüm çalışmalar'],...runList().map(r=>[r.id,'#'+r.id])],af.run,"af.run=this.value;render()",'Çalışma')}${dateInput('from',af,'Başlangıç')}${dateInput('to',af,'Bitiş')}</div>`+panel('Uyarılar',rows.length?`<div style="overflow:auto"><table><tr><th>Makine</th><th>Tür / Açıklama</th><th>Kaynak</th><th>Başlangıç / Kapanış</th><th>Durum</th></tr>${rows.map(a=>`<tr tabindex="0" onclick="showAlert('${a.id}')" onkeydown="if(event.key==='Enter')showAlert('${a.id}')"><td style="color:${colors[a.machine]}">Makine ${a.machine+1}</td><td>${a.type}<br><small>${a.description}</small></td><td>${a.source}</td><td>${stamp(a.start)}<br>${stamp(a.end)}</td><td><span class="badge ${a.end?'':'warn'}">${a.end?'Kapandı':'Aktif'}</span></td></tr>`).join('')}</table></div>`:'<div class="empty">Bu filtrelerde uyarı bulunmuyor.</div>');let a=rows.find(a=>a.id===alertId);if(a)app.innerHTML+=panel('Uyarı ayrıntısı',`<p><b>Makine ${a.machine+1} · ${a.type}</b></p><p>${a.description}</p><p>Kaynak: ${a.source}<br>Başlangıç: ${stamp(a.start)}<br>Kapanış: ${stamp(a.end)}<br>Durum: ${a.end?'Kapandı':'Aktif'}</p><button class="primary" onclick="machine=${a.machine};go(1)">Makine Detayına Git →</button>`)}
function renderHistory(){let runs=state.runs.filter(r=>(!hf.scenario||r.scenario===hf.scenario)&&(!hf.status||(r.status||'Kullanıcı durdurdu')===hf.status)&&(!hf.from||r.start>=new Date(hf.from).getTime())&&(!hf.to||r.start<new Date(hf.to).getTime()+86400000));app.innerHTML=`<div class="panel row">${opt([['','Tüm senaryolar'],...['Normal çalışma','Uzun boşta bekleme','Yüksek güç tüketimi'].map(x=>[x,x])],hf.scenario,"hf.scenario=this.value;render()",'Senaryo')}${opt([['','Tüm durumlar'],...['Tamamlandı','Kullanıcı durdurdu','Hata'].map(x=>[x,x])],hf.status,"hf.status=this.value;render()",'Durum')}${dateInput('from',hf,'Başlangıç tarihi')}${dateInput('to',hf,'Bitiş tarihi')}</div>`+panel('Geçmiş çalışmalar',runs.length?`<div style="overflow:auto"><table><tr><th>Çalışma / Senaryo</th><th>Başlangıç / Bitiş</th><th>Süre</th><th>Durum</th><th>Enerji / Üretim</th><th>Uyarı</th><th></th></tr>${runs.map(r=>`<tr><td>#${r.id}<br>${r.scenario}</td><td>${stamp(r.start)}<br>${stamp(r.end)}</td><td>${time(r.elapsed)}</td><td>${r.status||'Kullanıcı durdurdu'}</td><td>${fmt(r.elapsed*18/3600)} kWh<br>${[20,24,28].reduce((n,p)=>n+Math.floor(r.elapsed/p),0)} adet</td><td>${alertsFor(r).length}</td><td><button class="primary" onclick="historySummary=state.runs.find(r=>r.id===${r.id});render()">Sonuçları Gör</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Bu filtrelerde geçmiş çalışma bulunmuyor.</div>');if(historySummary){let r=historySummary;app.innerHTML+=panel('Çalışma #'+r.id+' özeti',`<p>${r.scenario} · ${r.status||'Kullanıcı durdurdu'}<br>${stamp(r.start)} — ${stamp(r.end)}</p><div class="grid three">${metric('Toplam enerji',fmt(r.elapsed*18/3600)+' kWh')}${metric('Toplam üretim',[20,24,28].reduce((n,p)=>n+Math.floor(r.elapsed/p),0)+' adet')}${metric('Toplam uyarı',alertsFor(r).length)}</div><div class="row">${[0,1,2].map(p=>`<button onclick="history=historySummary;go(${p})">${pages[p]} →</button>`).join('')}</div>`)}}
stop=function(status='Kullanıcı durdurdu'){state.elapsed=elapsed();state.running=false;state.end=Date.now();state.status=status;state.runs.unshift({id:Math.max(0,...state.runs.map(r=>+r.id))+1,start:state.start,end:state.end,elapsed:state.elapsed,scenario:state.scenario,status});save();render()};
window.addEventListener('storage',e=>{if(e.key==='factory-demo'){state=JSON.parse(e.newValue);render()}});
window.addEventListener('offline',()=>{document.querySelector('header .badge').textContent='Bağlantı kesildi · Son değerler güncel olmayabilir'});
window.addEventListener('online',()=>render());
setInterval(()=>{if(!demoConnected)return;if(state.running&&elapsed()>=1800)stop('Tamamlandı');else if(state.running&&!history&&page!==4){let focus=document.activeElement;if(!['SELECT','INPUT','BUTTON'].includes(focus?.tagName))render()}},1000);render();


function showError(message){let e=document.querySelector('#operation-error');if(!e){document.querySelector('main').insertAdjacentHTML('afterbegin','<div id="operation-error" class="banner warn" role="alert"></div>');e=document.querySelector('#operation-error')}e.textContent=message}
function chart(indices=[0,1,2],kind='power'){
 const t=active().elapsed||0;if(!t)return '<div class="empty">Simülasyon başlatılmadı</div>';
 const width=800,height=205,left=48,right=775,top=22,bottom=165;
 const values=indices.map(i=>Array.from({length:91},(_,j)=>{const sec=t*j/90;return kind==='energy'?sec*[8,6,4][i]/3600:kind==='production'?Math.floor(sec/[20,24,28][i]):[8,6,4][i]+Math.sin(sec/9+i)*.5}));
 const max=Math.max(...values.flat(),.01)*1.15;
 let svg='<svg class="chart" viewBox="0 0 800 205" role="img" aria-label="'+(kind==='power'?'Güç':kind==='energy'?'Birikimli enerji':'Üretim')+' zaman grafiği">';
 for(let k=0;k<5;k++){let y=bottom-(bottom-top)*k/4;svg+='<path d="M'+left+' '+y+'H'+right+'" stroke="#e6edf3"/><text x="5" y="'+(y+4)+'" fill="#7b8b9c" font-size="10">'+fmt(max*k/4,kind==='production'?0:2)+'</text>';let x=left+(right-left)*k/4;svg+='<text text-anchor="middle" x="'+x+'" y="190" fill="#7b8b9c" font-size="11">'+time(t*k/4)+'</text>'}
 values.forEach((v,k)=>{let points=v.map((n,j)=>{let x=left+(right-left)*j/90,y=bottom-n/max*(bottom-top);return j?(kind==='production'?'H'+x+'V'+y:'L'+x+','+y):'M'+x+','+y}).join(' ');svg+='<path d="'+points+'" fill="none" stroke="'+colors[indices[k]]+'" stroke-width="2.3"/>';if(kind==='power'&&indices.length===1&&indices[0]===2&&alertsFor(viewRun()).length){let j=60,x=left+(right-left)*j/90,y=bottom-v[j]/max*(bottom-top);svg+='<circle cx="'+x+'" cy="'+y+'" r="6" fill="#e7495b" tabindex="0" role="button" aria-label="Anomali ayrıntısını aç" onclick="document.querySelector(\'#anomaly\').hidden=false" onkeydown="if(event.key===\'Enter\')document.querySelector(\'#anomaly\').hidden=false"><title>Yapay zekâ anomalisi · Ayrıntıyı aç</title></circle>'}});
 return svg+'</svg><small>Geçen simülasyon süresi · '+(kind==='power'?'kW':kind==='energy'?'kWh':'adet')+'</small>';
}
demoConnected=true;
const completeRender=render;
render=function(){completeRender();document.querySelector('header .badge').textContent=demoConnected?'● Demo bağlantısı aktif':'Bağlantı kesildi · Son değerler güncel değil';let tools=document.querySelector('#demo-tools');if(!tools){document.querySelector('footer').insertAdjacentHTML('beforebegin','<details id="demo-tools" class="panel"><summary>Demo durumlarını incele</summary><p>Bu araçlar yalnızca arayüzün boş, bağlantı ve hata durumlarını gösterir.</p><div class="row"><button onclick="toggleConnection()">Bağlantıyı kes / yeniden bağla</button><button onclick="showError(\'İşlem tamamlanamadı. Sunucuya ulaşılamıyor; lütfen yeniden deneyin.\')">İşlem hatasını göster</button><button onclick="loadExamples()">Örnek geçmiş kayıtları ekle</button></div></details>')}
 if(page===0){app.querySelectorAll('.machine').forEach((card,i)=>{let badges=card.querySelectorAll('.badge');if(badges[1]&&i===2&&alertsFor(viewRun()).length)badges[1].textContent='Olağandışı';let values=card.querySelectorAll('.values b');if(values[3]&&values[3].textContent!=='—'&&values[3].textContent!=='Üretim yok')values[3].textContent+=' kWh/parça'})}if(page===0&&!history){let button=app.querySelector('.primary');if(button&&!demoConnected)button.disabled=true}
 if(!demoConnected)document.querySelector('#banner').insertAdjacentHTML('beforeend','<div class="banner warn" role="status">Bağlantı kesildi. Son alınan ölçümler korunuyor; değerler güncel olmayabilir.</div>');
};
function toggleConnection(){if(demoConnected)frozenElapsed=elapsed();demoConnected=!demoConnected;render()}
function loadExamples(){if(state.runs.some(r=>r.example))return;const now=Date.now();['Normal çalışma','Uzun boşta bekleme','Yüksek güç tüketimi'].forEach((scenario,i)=>state.runs.push({id:Math.max(0,...state.runs.map(r=>+r.id))+1,scenario,start:now-(i+1)*86400000,end:now-(i+1)*86400000+1800000,elapsed:1800,status:['Tamamlandı','Kullanıcı durdurdu','Hata'][i],example:true}));save();render()}
window.addEventListener('error',()=>showError('Ekran güncellenemedi. Sonuçları koruyarak sayfayı yenileyebilirsiniz.'));
render();

var chartInstances=[];
function mountChartJS(){
 if(typeof Chart==='undefined'){showError('Grafik kütüphanesi yüklenemedi. ZIP dosyasını tamamen çıkarıp yeniden açın.');return}
 Chart.defaults.font.family='Segoe UI, sans-serif';Chart.defaults.color='#718297';
 const allSvg=[...document.querySelectorAll('#app svg.chart')];
 allSvg.forEach(svg=>{const section=svg.closest('section'),title=section?.querySelector('h3')?.textContent||'',parent=svg.parentElement,holder=document.createElement('div');holder.style.cssText='height:230px;position:relative';const canvas=document.createElement('canvas');canvas.setAttribute('aria-label',title);canvas.setAttribute('role','img');holder.appendChild(canvas);svg.replaceWith(holder);
 let type='line',datasets=[],labels=[],unit='kW',isCompare=page===2;
 if(isCompare){let runs=history?[history]:runList(),r=runs.find(x=>String(x.id)===comparisonRun)||runs[0],ds=[0,1,2].map(i=>intervalData(r,i));let metric=title.startsWith('Enerji tüketimi')?'energy':title.startsWith('Üretim')?'production':'ratio';unit=metric==='energy'?'kWh':metric==='production'?'adet':'kWh/parça';labels=['Makine 1','Makine 2','Makine 3'];type='bar';datasets=[{label:unit,data:ds.map(d=>d[metric]),backgroundColor:colors,borderRadius:5,maxBarThickness:70}]
 }else{let t=active().elapsed||0;let kind=title.includes('Birikimli')?'energy':title.includes('Üretim')?'production':'power';unit=kind==='energy'?'kWh':kind==='production'?'adet':'kW';labels=Array.from({length:91},(_,j)=>time(t*j/90));let indices=page===1?[machine]:[0,1,2];datasets=indices.map(i=>({label:'Makine '+(i+1),data:labels.map((_,j)=>{let sec=t*j/90;return kind==='energy'?sec*[8,6,4][i]/3600:kind==='production'?Math.floor(sec/[20,24,28][i]):[8,6,4][i]+Math.sin(sec/9+i)*.5}),borderColor:colors[i],backgroundColor:colors[i],borderWidth:2,pointRadius:0,tension:0,stepped:kind==='production'?'after':false}));if(page===1&&machine===2&&kind==='power'&&alertsFor(viewRun()).length){datasets.push({label:'Anomali',data:labels.map((_,j)=>j===60?datasets[0].data[j]:null),showLine:false,pointRadius:6,pointHoverRadius:8,backgroundColor:'#e74b5b',borderColor:'#e74b5b'})}}
 chartInstances.push(new Chart(canvas,{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:!isCompare,position:'top',align:'end',labels:{usePointStyle:true,boxWidth:7}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+(c.parsed.y===null?'Üretim yok':fmt(c.parsed.y,unit==='adet'?0:unit==='kWh/parça'?4:3))+' '+unit}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6},title:{display:!isCompare,text:'Geçen simülasyon süresi'}},y:{beginAtZero:true,title:{display:true,text:unit},ticks:{precision:unit==='adet'?0:undefined}}},onClick:(event,elements)=>{if(elements.some(e=>datasets[e.datasetIndex]?.label==='Anomali')){const detail=document.querySelector('#anomaly');if(detail){detail.hidden=false;detail.scrollIntoView({block:'nearest'})}}}}}));
 });
 if(page===2){let section=[...document.querySelectorAll('section')].find(s=>s.querySelector('h3')?.textContent.startsWith('Çalışma /'));if(section){let runs=history?[history]:runList(),r=runs.find(x=>String(x.id)===comparisonRun)||runs[0],ds=[0,1,2].map(i=>intervalData(r,i));section.innerHTML='<h3>Çalışma / boşta bekleme / duruş · dakika</h3><div style="height:230px;position:relative"><canvas aria-label="Makine süreleri" role="img"></canvas></div>';chartInstances.push(new Chart(section.querySelector('canvas'),{type:'bar',data:{labels:['Makine 1','Makine 2','Makine 3'],datasets:[{label:'Çalışma',data:ds.map(d=>d.work),backgroundColor:'#43ad80'},{label:'Boşta bekleme',data:ds.map(d=>d.idle),backgroundColor:'#edb543'},{label:'Duruş',data:ds.map(d=>d.down),backgroundColor:'#95a2b2'}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:false,scales:{x:{stacked:true,beginAtZero:true,title:{display:true,text:'Dakika'}},y:{stacked:true}},plugins:{legend:{position:'bottom'}}}}))}}
}
const renderWithDemo=render;
render=function(){chartInstances.forEach(c=>c.destroy());chartInstances=[];renderWithDemo();mountChartJS()};
render();
</script></html>
